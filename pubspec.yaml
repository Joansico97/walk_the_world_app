name: walk_the_world_app
description: 'A new Flutter project.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Graphics
  cupertino_icons: ^1.0.8
  animate_do: ^3.3.8

  # State Management
  bloc: ^9.0.0
  hydrated_bloc: ^10.0.0
  flutter_bloc: ^9.0.0

  # Packages
  either_dart: ^1.0.0
  freezed_annotation: ^2.4.4
  get_it: ^8.0.3
  go_router: ^14.6.3
  intl: ^0.19.0
  intl_utils: ^2.8.8
  json_annotation: ^4.9.0
  envied: ^1.1.0
  http: ^1.3.0

  # Utils
  logger: ^2.5.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Code Generation
  build_runner: ^2.4.14
  envied_generator: ^1.1.0
  flutter_gen_runner: ^5.8.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # Utils
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato/Lato-Black.ttf
          weight: 700
        - asset: assets/fonts/Lato/Lato-Bold.ttf
          weight: 600
        - asset: assets/fonts/Lato/Lato-Regular.ttf
          weight: 500
        - asset: assets/fonts/Lato/Lato-Light.ttf
          weight: 400
        - asset: assets/fonts/Lato/Lato-Thin.ttf
          weight: 300

flutter_intl:
  enabled: true
  class_name: IntlTranslations
  main_locale: es
  arb_dir: lib/l10n
  output_dir: lib/gen
