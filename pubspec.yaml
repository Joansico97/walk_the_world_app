name: wtw_app
description: 'A new travel pal for you and your friends.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  animate_do: ^4.0.0
  auto_size_text: ^3.0.0
  cloud_firestore: ^5.6.3
  cupertino_icons: ^1.0.2
  either_dart: ^1.0.0
  envied: ^1.1.1
  firebase_auth: ^5.4.2
  firebase_core: ^3.11.0
  firebase_storage: ^12.4.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^2.4.4
  go_router: ^14.8.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  intl_phone_field: ^3.2.0
  intl_utils: ^2.8.8
  json_annotation: ^4.9.0
  logger: ^2.5.0
  phosphor_flutter: ^2.1.0
  translator: ^1.0.3+1

dev_dependencies:
  build_runner: ^2.4.14
  envied_generator: ^1.1.0
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.4.4
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  hive_generator: ^2.0.1
  json_serializable: ^6.9.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato/Lato-Black.ttf
          weight: 700
        - asset: assets/fonts/Lato/Lato-Bold.ttf
          weight: 600
        - asset: assets/fonts/Lato/Lato-Regular.ttf
          weight: 500
        - asset: assets/fonts/Lato/Lato-Light.ttf
          weight: 400
        - asset: assets/fonts/Lato/Lato-Thin.ttf
          weight: 300

flutter_intl:
  enabled: true
  class_name: S
  main_locale: es
  arb_dir: lib/l10n
  output_dir: lib/gen

flutter_gen:
  output: lib/gen

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/images/app_icon.jpeg'
  adaptive_icon_background: 'assets/images/app_icon.jpeg'
  min_sdk_android: 21

flutter_native_splash:
  color: '#9FC3E7'
  image: assets/images/app_icon.jpeg
  color_dark: '#9FC3E7'
  image_dark: assets/images/app_icon.jpeg
  android_12:
    image: assets/images/app_icon.jpeg
    icon_background_color: '#9FC3E7'
    image_dark: assets/images/app_icon.jpeg
    icon_background_color_dark: '#9FC3E7'
